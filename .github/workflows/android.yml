# Builds the Android APK on every push to main (or by hand from the Actions
# tab) and publishes it on the repository's Releases page, so it can be
# downloaded and installed straight from a phone.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Release signing key (optional, from repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Using the release signing key."
          else
            echo "::warning::No signing secrets set - building with a temporary debug key. Updating the app later will need an uninstall (see INSTALL_FROM_GITHUB.md)."
          fi

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk KoraVuba-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KoraVuba-android
          path: KoraVuba-${{ github.run_number }}.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: KoraVuba Android build ${{ github.run_number }}
          body: |
            Download **KoraVuba-${{ github.run_number }}.apk** below on your Android phone, open it and tap Install.
            Commit: ${{ github.sha }}
          files: KoraVuba-${{ github.run_number }}.apk
          make_latest: true
