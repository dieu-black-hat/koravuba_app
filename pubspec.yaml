name: koravuba
description: "KoraVuba - company-verified on-demand services in Kigali. Standalone app with its own bundled database (copy of globalconnect_db)."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  image_picker: ^1.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/images/
